name: hermes-office-kanban
version: "0.2.0"
description: Hermes Office Kanban Portal tools, slash commands, planning hooks, and bundled planning skills.
author: NeuroStepa / Real Lager
kind: standalone
requires_env:
  - KANBAN_PORTAL_AGENT_TOKEN
provides_tools:
  - office_kanban_get_status
  - office_kanban_create_task
  - office_kanban_create_plan
  - office_kanban_post_message
  - office_kanban_update_task
provides_hooks:
  - pre_gateway_dispatch
